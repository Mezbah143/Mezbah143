<text x="78" y="70" fill="#cbd5eb" font-size="13" letter-spacing="2">CODE WITH PURPOSE.</text>
<text x="58" y="166" fill="#f3f5ff" font-size="72" font-weight="700" letter-spacing="-3">MEZBAH <tspan fill="url(#accent)">UDDIN</tspan></text><g class="role first" style="animation-delay:0s"><text x="58" y="228" fill="#67e8f9" font-family="monospace" font-size="23">Software Developer</text></g><g class="role " style="animation-delay:6s"><text x="58" y="228" fill="#67e8f9" font-family="monospace" font-size="23">Full-Stack Development Enthusiast</text></g><g class="role " style="animation-delay:12s"><text x="58" y="228" fill="#67e8f9" font-family="monospace" font-size="23">IT Student in South Korea</text></g><g class="role " style="animation-delay:18s"><text x="58" y="228" fill="#67e8f9" font-family="monospace" font-size="23">Building Real-World Applications</text></g><text x="58" y="284" fill="#d1d9ec" font-size="24">Turning ideas into practical software.</text><path d="M58 334H1142" stroke="#2b3551"/><text x="58" y="364" fill="#98a9c8" font-size="13" letter-spacing="1">ULSAN, SOUTH KOREA</text><text x="1142" y="364" fill="#98a9c8" font-size="13" letter-spacing="1" text-anchor="end">JAVA / WEB / MOBILE / AI</text><g transform="translate(968 190)"><circle r="111" fill="none" stroke="#525981" stroke-opacity=".45"/><circle r="84" fill="none" stroke="#586b98" stroke-opacity=".45" stroke-dasharray="2 7"/>
