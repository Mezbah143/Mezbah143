<svg xmlns="http://www.w3.org/2000/svg" width="600" height="490" viewBox="0 0 600 490" role="img" aria-labelledby="title desc">
<title id="title">Mezbah Uddin | Software Developer</title>
<desc id="desc">Turning ideas into practical software. IT student in Ulsan, South Korea. Animated roles: software developer, full-stack development enthusiast, IT student in South Korea, building real-world applications.</desc>
<defs>
<linearGradient id="base" x2="1" y2="1"><stop stop-color="#080d1b"/><stop offset=".6" stop-color="#11192f"/><stop offset="1" stop-color="#201638"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abcf"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#5044a8" stop-opacity=".38"/><stop offset="1" stop-color="#5044a8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8099c9" stroke-opacity=".07"/></pattern>
</defs><style>@keyframes orbit {to {transform:rotate(360deg)}}
@keyframes breathe {50% {opacity:.55}}
@keyframes type {0% {clip-path:inset(0 100% 0 0)} 12%,21% {clip-path:inset(0 0 0 0)} 25%,100% {clip-path:inset(0 100% 0 0)}}
.orbit {transform-box:fill-box;transform-origin:center;animation:orbit 60s linear infinite}
.pulse {animation:breathe 6s ease-in-out infinite}
.role {clip-path:inset(0 100% 0 0);animation:type 24s steps(34,end) infinite}
@media (prefers-reduced-motion:reduce) {.orbit,.pulse,.role {animation:none}.role {display:none}.role.first {display:block;clip-path:none}}
</style>
<rect x="1" y="1" width="598" height="488" rx="24" fill="url(#base)" stroke="#2b3551"/>
<rect x="1" y="1" width="598" height="488" rx="24" fill="url(#grid)"/>
<ellipse class="pulse" cx="510" cy="180" rx="330" ry="280" fill="url(#halo)"/>
<path d="M40 28H126" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
<g font-family="Arial, Helvetica, sans-serif">
<circle cx="45" cy="65" r="4" fill="#67e8f9" class="pulse"/>
<text x="60" y="70" fill="#cbd5eb" font-size="13" letter-spacing="2">CODE WITH PURPOSE.</text>
<text x="40" y="154" fill="#f3f5ff" font-size="58" font-weight="700" letter-spacing="-2">MEZBAH</text><text x="40" y="220" fill="url(#accent)" font-size="58" font-weight="700" letter-spacing="-2">UDDIN</text><g class="role first" style="animation-delay:0s"><text x="40" y="260" fill="#67e8f9" font-family="monospace" font-size="21">Software Developer</text></g><g class="role " style="animation-delay:6s"><text x="40" y="260" fill="#67e8f9" font-family="monospace" font-size="21">Full-Stack Development Enthusiast</text></g><g class="role " style="animation-delay:12s"><text x="40" y="260" fill="#67e8f9" font-family="monospace" font-size="21">IT Student in South Korea</text></g><g class="role " style="animation-delay:18s"><text x="40" y="260" fill="#67e8f9" font-family="monospace" font-size="21">Building Real-World Applications</text></g><text x="40" y="329" fill="#d1d9ec" font-size="25">Turning ideas into</text><text x="40" y="365" fill="#d1d9ec" font-size="25">practical software.</text><path d="M40 409H560" stroke="#2b3551"/><text x="40" y="439" fill="#98a9c8" font-size="14" letter-spacing="1">ULSAN, SOUTH KOREA</text></g></svg>